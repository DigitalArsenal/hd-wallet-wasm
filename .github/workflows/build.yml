name: Build and verify wallet release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup exact Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.18.0"

      - name: Install exact npm
        run: npm install --global npm@11.16.0

      - name: Setup exact Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021
        with:
          version: "3.1.51"

      - name: Install verified CMake 4.0.0
        shell: bash
        run: |
          set -euo pipefail
          cmake_tmp="$(mktemp -d)"
          trap 'rm -rf -- "$cmake_tmp"' EXIT
          archive="$cmake_tmp/cmake-4.0.0-linux-x86_64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/Kitware/CMake/releases/download/v4.0.0/cmake-4.0.0-linux-x86_64.tar.gz
          printf '%s  %s\n' \
            'a06e6e32da747e569162bc0442a3fd400fadd9db7d4f185c9e4464ab299a294b' \
            "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/cmake-4.0.0"
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/cmake-4.0.0" --strip-components=1 \
            --no-same-owner --no-same-permissions
          echo "$RUNNER_TEMP/cmake-4.0.0/bin" >> "$GITHUB_PATH"

      - name: Verify frozen platform and tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.39'
          test "$(node --version)" = v24.18.0
          test "$(npm --version)" = 11.16.0
          emcc --version | head -n 1 | grep -F '3.1.51'
          test "$(cmake --version | head -n 1)" = 'cmake version 4.0.0'
          node -e "const t=require('./release/toolchain.v1.json'); if(t.node.version!=='24.18.0'||t.npm.version!=='11.16.0')process.exit(1)"

      - name: Run complete local gate
        run: ./scripts/ci-local.sh

      - name: Emit canonical release artifacts
        shell: bash
        env:
          SDN_RELEASE_EVENT_NAME: ${{ github.event_name }}
          SDN_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SDN_RELEASE_RUN_ID: ${{ github.run_id }}
          SDN_RELEASE_WORKFLOW: .github/workflows/build.yml
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/sdn-wallet-artifacts"
          mkdir "$artifact_root"
          npm run verify:release -- \
            --version 2.0.30 \
            --source-ref HEAD \
            --skip-tag \
            --emit-artifacts "$artifact_root"

      - name: Upload npm tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/sdn-wallet-artifacts/npm-tarballs
          if-no-files-found: error
          retention-days: 7

      - name: Upload origin service
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origin-service
          path: ${{ runner.temp }}/sdn-wallet-artifacts/origin-service
          if-no-files-found: error
          retention-days: 7

      - name: Upload wallet release report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wallet-release-report
          path: ${{ runner.temp }}/sdn-wallet-artifacts/wallet-release-report
          if-no-files-found: error
          retention-days: 7
